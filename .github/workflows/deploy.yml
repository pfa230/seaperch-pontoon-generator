name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Skip publishing when a newer commit that contains this one is already live.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shas=$(gh run list --workflow deploy.yml --branch main --status success --json headSha --jq '.[].headSha')
          skip=false
          for sha in $shas; do
            if [ "$sha" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
              echo "::notice::Not deploying $GITHUB_SHA: newer commit $sha is already live"
              skip=true
              break
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seaperch-pontoon-generator --branch=main
