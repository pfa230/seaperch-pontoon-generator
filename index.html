<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeaPerch Pontoon Generator</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Big+Shoulders:wght@700;800&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>SeaPerch Pontoon Generator</h1>
      <form id="form" novalidate>
        <label>Outer diameter (mm) <input name="diameter" type="number" step="any" /></label>
        <label>Length (mm) <input name="length" type="number" step="any" /></label>
        <label>
          Wall thickness (mm)
          <select name="wall">
            <option value="0.8">0.8</option>
            <option value="1.2">1.2</option>
            <option value="1.6">1.6</option>
          </select>
        </label>
        <label>
          Mount type
          <select name="mountType">
            <option value="pipe">Inside pipe</option>
            <option value="fitting">Into fitting</option>
          </select>
        </label>
        <label>
          Mount angle
          <select name="angle">
            <option value="0">0°</option>
            <option value="30">30°</option>
            <option value="45">45°</option>
            <option value="60">60°</option>
            <option value="90">90°</option>
          </select>
        </label>
        <label>
          Filament
          <select name="filament">
            <option value="pla">PLA</option>
            <option value="petg">PETG</option>
            <option value="asa">ASA/ABS</option>
          </select>
        </label>
      </form>
      <div class="pool">
        <div id="preview"></div>
        <p id="status"></p>
        <div class="preview-controls">
          <button id="reset-view" type="button">Reset view</button>
          <label>
            <input id="cross-section" type="checkbox" />
            Show cross-section
          </label>
        </div>
      </div>
      <section>
        <dl>
          <div>
            <dt>Displaced volume</dt>
            <dd id="displaced">–</dd>
          </div>
          <div>
            <dt>Estimated mass</dt>
            <dd id="mass">–</dd>
          </div>
          <div>
            <dt>Net lift</dt>
            <dd id="lift">–</dd>
          </div>
        </dl>
        <button id="step" type="button" disabled>Download STEP</button>
        <button id="stl" type="button" disabled>Download STL</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
